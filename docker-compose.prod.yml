# Production / hosted-demo topology. Same images and code as the laptop stack, with:
#   * only Caddy published (80/443), automatic HTTPS when SITE_ADDRESS is a domain
#   * no database, cache or object-store ports exposed
#   * required secrets (the stack refuses to start without them)
#   * restart policies, so the demo survives a reboot
#
#   cp deploy/.env.production.example .env      # then fill it in (deploy/setup-vm.sh does this for you)
#   docker compose -f docker-compose.prod.yml up -d --build
#   docker compose -f docker-compose.prod.yml up -d --scale worker=4
#
# Project name differs from the laptop stack so the two never share volumes.
name: hospital-prod

x-app-build: &app-build
  context: .
  target: runtime

x-app-env: &app-env
  ENVIRONMENT: production
  LOG_LEVEL: ${LOG_LEVEL:-INFO}
  DATABASE_URL: postgresql+psycopg2://${POSTGRES_USER:-hospital}:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-hospital}
  REDIS_URL: redis://redis:6379
  JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET}
  CORS_ORIGINS: ${CORS_ORIGINS:-}
  S3_ENDPOINT_URL: http://objectstore:9000
  S3_ACCESS_KEY: ${S3_ACCESS_KEY:-minioadmin}
  S3_SECRET_KEY: ${S3_SECRET_KEY:-minioadmin}
  S3_BUCKET: ${S3_BUCKET:-hospital-events}
  SEED_USERS: ${SEED_USERS:-true}
  ALLOW_DEMO_SEED: ${ALLOW_DEMO_SEED:-true}
  SEED_ADMIN_EMAIL: ${SEED_ADMIN_EMAIL:-admin@hospital.local}
  SEED_ADMIN_PASSWORD: ${SEED_ADMIN_PASSWORD:?set SEED_ADMIN_PASSWORD}
  SEED_ANALYST_EMAIL: ${SEED_ANALYST_EMAIL:-analyst@hospital.local}
  SEED_ANALYST_PASSWORD: ${SEED_ANALYST_PASSWORD:?set SEED_ANALYST_PASSWORD}
  SEED_VIEWER_EMAIL: ${SEED_VIEWER_EMAIL:-viewer@hospital.local}
  SEED_VIEWER_PASSWORD: ${SEED_VIEWER_PASSWORD:?set SEED_VIEWER_PASSWORD}
  SEED_INGEST_API_KEY: ${SEED_INGEST_API_KEY:-}
  CELERY_VISIBILITY_TIMEOUT: ${CELERY_VISIBILITY_TIMEOUT:-45}

services:
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:-:80}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      api:
        condition: service_healthy

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-hospital}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-hospital}
    command: >
      postgres
      -c max_connections=200
      -c shared_buffers=${PG_SHARED_BUFFERS:-512MB}
      -c work_mem=32MB
      -c maintenance_work_mem=256MB
      -c synchronous_commit=off
      -c max_wal_size=2GB
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-hospital} -d ${POSTGRES_DB:-hospital}"]
      interval: 3s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--save", "", "--appendonly", "no", "--maxmemory-policy", "noeviction"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 20

  objectstore:
    image: chrislusf/seaweedfs:latest
    restart: unless-stopped
    command: ["server", "-dir=/data", "-s3", "-s3.port=9000", "-volume.max=50", "-master.volumeSizeLimitMB=512"]
    volumes:
      - objectdata:/data

  migrate:
    build: *app-build
    image: hospital-migrate
    environment: *app-env
    command: ["sh", "-c", "alembic upgrade head && python -m scripts.bootstrap"]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      objectstore:
        condition: service_started
    restart: "no"

  api:
    build: *app-build
    image: hospital-api
    restart: unless-stopped
    environment:
      <<: *app-env
      SERVICE_NAME: api
      DB_POOL_SIZE: ${DB_POOL_SIZE:-20}
    # Only Caddy can reach this port, so trusting its forwarded headers is safe and makes
    # per-client rate limiting and logs see the real visitor address.
    command:
      - sh
      - -c
      - exec uvicorn app.main:app --host 0.0.0.0 --port 8000 --no-access-log --proxy-headers --forwarded-allow-ips='*' --workers ${API_WORKERS:-2}
    expose:
      - "8000"
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/health"]
      interval: 5s
      timeout: 3s
      retries: 20

  worker:
    build: *app-build
    image: hospital-worker
    restart: unless-stopped
    environment:
      <<: *app-env
      SERVICE_NAME: worker
      DB_POOL_SIZE: "5"
      DB_MAX_OVERFLOW: "2"
    command:
      - sh
      - -c
      - exec celery -A app.pipeline.celery_app:celery_app worker --loglevel=INFO --concurrency=${WORKER_CONCURRENCY:-2} --hostname=worker@%h
    depends_on:
      migrate:
        condition: service_completed_successfully

  # One-off tooling (data generation, loading, running an analysis). Not a long-running service.
  #   docker compose -f docker-compose.prod.yml --profile tools run --rm tools python -m scripts.generate ...
  tools:
    build:
      context: .
      target: dev
    image: hospital-tools
    profiles: ["tools"]
    environment:
      <<: *app-env
      SERVICE_NAME: tools
      API_BASE_URL: http://api:8000
    volumes:
      - ./:/app
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  pgdata:
  objectdata:
  caddy_data:
  caddy_config:
